services:
  # -----------------------------------------------------
  # Unified API + Frontend (Cloud Native Architecture)
  # -----------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: amy-chatbot-unified
    container_name: amy_unified
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # Mount ChromaDB storage to persist index between container restarts
      - ./chroma_db:/app/chroma_db
      # Mount data directory for live updates
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
