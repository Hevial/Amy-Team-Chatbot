steps:
  # ==============================================================================
  # STEP 0: Pull the previous image to use as Docker Layer Cache (Speeds up build)
  # ==============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'pull-cache'
    entrypoint: 'bash'
    args: ['-c', 'docker pull $_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/$_SERVICE_NAME:latest || exit 0']

  # ==============================================================================
  # STEP 1: Build the unified container image using the multi-stage Dockerfile
  # ==============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-unified-image'
    args: 
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/$_SERVICE_NAME:$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/$_SERVICE_NAME:latest'
      - '--cache-from'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/$_SERVICE_NAME:latest'
      - '.'
    
  # ==============================================================================
  # STEP 2: Push the image to Google Artifact Registry
  # ==============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args: 
      - 'push'
      - '--all-tags'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/$_SERVICE_NAME'
    
  # ==============================================================================
  # STEP 3: Deploy the image to Google Cloud Run
  # ==============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-to-cloud-run'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/$_SERVICE_NAME:$COMMIT_SHA'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # Inject necessary environment variables for the RAG engine and Vector Store
      - '--set-env-vars=ENABLE_GOOGLE_SEARCH=true,VECTOR_STORE_TYPE=firestore,FIRESTORE_PROJECT_ID=$PROJECT_ID'
      # Securely map the Google API Key from Google Secret Manager
      - '--update-secrets=GOOGLE_API_KEY=google_api_key:latest'

# ==============================================================================
# Tell Cloud Build which images it produced so it tracks them in the UI
# ==============================================================================
images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/$_SERVICE_NAME:$COMMIT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REGISTRY_REPO/$_SERVICE_NAME:latest'

# ==============================================================================
# Default variables (can be overridden in the Cloud Build Trigger UI)
# ==============================================================================
substitutions:
  _ARTIFACT_REGISTRY_REPO: 'amnesia-repo'
  _SERVICE_NAME: 'amy-chatbot'
  _REGION: 'europe-west1'
